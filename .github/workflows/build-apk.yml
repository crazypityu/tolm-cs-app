name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android via Capacitor
        run: |
          mkdir -p wrapper
          cd wrapper
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://tolm-cs-app.streamlit.app">
              <title>Tolmacs App</title>
            </head>
            <body style="background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;">
              <p>Betöltés...</p>
            </body>
          </html>
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.istvan.tolmacs",
            "appName": "Tolmacs App",
            "webDir": "www",
            "server": {
              "url": "https://tolm-cs-app.streamlit.app",
              "cleartext": true
            }
          }
          EOF

          npx cap add android

          # Mikrofon és hálózati jogosultságok hozzáadása
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST

          # Android APK fordítás
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tolmacs-App-Android
          path: wrapper/android/app/build/outputs/apk/debug/app-debug.apk
